[route]
file = "data/at_va_south.geojson"
start = [37.9013, -78.9852]   # Reeds Gap — SR-664 AT crossing [lat, lon] WGS-84
end   = [38.0310, -78.8580]   # Rockfish Gap (OSM segment terminus)

[map]
scale = 24000               # map scale denominator (1:24,000)
page_size = "letter"        # "letter" | "a4"
orientation = "landscape"   # "portrait" | "landscape"
overlap_m = 500             # meters of overlap between consecutive pages
margin_m  = 200             # safe margin inside each page frame (must be < overlap_m)
utm_zone  = 17              # UTM zone number, Northern Hemisphere

[layers]
topo_basemap      = true
usfs_boundary     = true
nps_boundary      = true
mile_markers      = true
utm_grid          = true
elevation_profile = true
pois              = true   # shelters and water sources from OpenStreetMap

[output]
path = "output/at_reids_rockfish.pdf"
